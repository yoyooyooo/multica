services:
  postgres:
    image: pgvector/pgvector:pg17
    # Avoid allocating one Docker subnet per retained audit project. The test
    # exposes only a fixed loopback port and never needs service-to-service DNS.
    network_mode: bridge
    environment:
      POSTGRES_DB: multica_cc_v049
      POSTGRES_USER: multica_cc_v049
      POSTGRES_PASSWORD: multica_cc_v049_local_only
    ports:
      - "127.0.0.1:55449:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multica_cc_v049 -d multica_cc_v049"]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
