{{- $workloadAssertionIssuer := required "backend.config.workloadAssertionIssuer must be a stable deployment-unique JWT issuer" .Values.backend.config.workloadAssertionIssuer -}}
{{- if or (eq (trim $workloadAssertionIssuer) "") (eq (trim $workloadAssertionIssuer) "multica") -}}
{{- fail "backend.config.workloadAssertionIssuer must be deployment-unique and cannot be multica" -}}
{{- end }}
{{- $workloadAssertionIssuerInstanceID := required "backend.config.workloadAssertionIssuerInstanceId must exactly match AGS trusted_issuers[].id" .Values.backend.config.workloadAssertionIssuerInstanceId -}}
{{- if or (ne $workloadAssertionIssuerInstanceID (trim $workloadAssertionIssuerInstanceID)) (not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._:@/+\\-]{0,254}$" $workloadAssertionIssuerInstanceID)) (eq $workloadAssertionIssuerInstanceID (trim $workloadAssertionIssuer)) (regexMatch "^(?i:multica|placeholder|example|change-me|changeme|replace-me|issuer-instance-id|mat_.*|ags_sess_.*|eyJ.*)$" $workloadAssertionIssuerInstanceID) -}}
{{- fail "backend.config.workloadAssertionIssuerInstanceId must be a distinct canonical secret-free safe ID, not a placeholder" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "multica.labels" . | nindent 4 }}
data:
  # --- Backend ---
  PORT: "8080"
  APP_ENV: {{ .Values.backend.config.appEnv | quote }}
  MULTICA_APP_URL: {{ .Values.backend.config.appUrl | quote }}
  FRONTEND_ORIGIN: {{ .Values.backend.config.frontendOrigin | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.backend.config.corsAllowedOrigins | quote }}
  COOKIE_DOMAIN: {{ .Values.backend.config.cookieDomain | quote }}
  RESEND_FROM_EMAIL: {{ .Values.backend.config.resendFromEmail | quote }}
  ALLOW_SIGNUP: {{ .Values.backend.config.allowSignup | quote }}
  ALLOWED_EMAILS: {{ .Values.backend.config.allowedEmails | quote }}
  ALLOWED_EMAIL_DOMAINS: {{ .Values.backend.config.allowedEmailDomains | quote }}
  DISABLE_WORKSPACE_CREATION: {{ .Values.backend.config.disableWorkspaceCreation | quote }}
  MULTICA_VCS_INTEGRATION_ENABLED: {{ .Values.backend.config.vcsIntegrationEnabled | quote }}
  MULTICA_WORKLOAD_ASSERTION_ISSUER: {{ $workloadAssertionIssuer | quote }}
  MULTICA_WORKLOAD_ASSERTION_ISSUER_INSTANCE_ID: {{ $workloadAssertionIssuerInstanceID | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.backend.config.googleClientId | quote }}
  GOOGLE_REDIRECT_URI: {{ .Values.backend.config.googleRedirectUri | quote }}
  S3_BUCKET: {{ .Values.backend.config.s3Bucket | quote }}
  S3_REGION: {{ .Values.backend.config.s3Region | quote }}
  CLOUDFRONT_DOMAIN: {{ .Values.backend.config.cloudfrontDomain | quote }}
  CLOUDFRONT_KEY_PAIR_ID: {{ .Values.backend.config.cloudfrontKeyPairId | quote }}
  LOCAL_UPLOAD_BASE_URL: {{ .Values.backend.config.localUploadBaseUrl | quote }}

  {{- if not .Values.postgres.external.enabled }}
  # --- PostgreSQL (consumed by the backend to build DATABASE_URL) ---
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  {{- end }}
